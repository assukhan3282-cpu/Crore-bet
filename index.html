<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crore Bet Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1a1e29 0%, #0c0e14 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
            color: #ffffff;
        }

        .form-card {
            background: rgba(22, 27, 38, 0.95);
            width: 100%;
            max-width: 430px;
            padding: 32px 26px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }

        /* --- LOGO STYLING --- */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .crore-bet-logo {
            background: #000000;
            display: inline-flex;
            align-items: center;
            padding: 8px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 242, 48, 0.3);
            box-shadow: 0 0 25px rgba(255, 242, 48, 0.15);
        }

        .crore-text {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-right: 10px;
            text-transform: uppercase;
        }

        .bet-badge {
            background: #fff230;
            color: #000000;
            font-size: 18px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- INPUT FIELDS --- */
        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #a4b1cd;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 13px 15px;
            background: #0f131c;
            border: 1px solid #283044;
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #5c6884;
        }

        input:focus,
        select:focus {
            border-color: #fff230;
            box-shadow: 0 0 12px rgba(255, 242, 48, 0.25);
            background: #141924;
        }

        /* Select option colors */
        select option {
            background: #161b26;
            color: #ffffff;
        }

        /* File Upload */
        .file-upload-box {
            position: relative;
            background: #0f131c;
            border: 1px dashed #343f5a;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .file-upload-box:hover {
            border-color: #fff230;
        }

        input[type="file"] {
            width: 100%;
            color: #a4b1cd;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: #252e42;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            margin-right: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: #fff230;
            color: #000000;
        }

        /* Submit Button */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #fff230 0%, #e6d300 100%);
            color: #000000;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 242, 48, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 242, 48, 0.45);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #484b3e;
            color: #8b8f80;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #statusMsg {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <!-- Brand Logo Only (Heading Hata Di Gayi Hai) -->
        <div class="logo-wrapper">
            <div class="crore-bet-logo">
                <span class="crore-text">CRORE</span>
                <span class="bet-badge">BET</span>
            </div>
        </div>

        <form id="tgForm">
            <!-- 1. Email -->
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <!-- 2. Name -->
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <!-- 3. Phone Number -->
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>
            </div>

            <!-- 4. User ID -->
            <div class="input-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" placeholder="Enter your user ID" required>
            </div>

            <!-- 5. Problem Issue -->
            <div class="input-group">
                <label for="problemIssue">Problem Issue</label>
                <select id="problemIssue" required>
                    <option value="" disabled selected>Select an issue...</option>
                    <option value="Email Confirm">Email Confirm</option>
                    <option value="Number Confirm">Number Confirm</option>
                    <option value="Profile Update">Profile Update</option>
                    <option value="Deposit Problem">Deposit Problem</option>
                    <option value="Bonus Issue">Bonus Issue</option>
                </select>
            </div>

            <!-- 6. Screenshot -->
            <div class="input-group">
                <label for="screenshot">Upload Screenshot (Optional)</label>
                <div class="file-upload-box">
                    <input type="file" id="screenshot" accept="image/*">
                </div>
            </div>

            <button type="submit" id="submitBtn">Submit Request</button>
            <p id="statusMsg"></p>
        </form>
    </div>

    <script>
        // Yahaan apna Telegram Bot Token aur Chat ID daalein
        const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";
        const CHAT_ID = "YOUR_CHAT_ID_HERE";

        const form = document.getElementById('tgForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";
            statusMsg.innerText = "";

            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const userId = document.getElementById('userId').value;
            const problemIssue = document.getElementById('problemIssue').value;
            const fileInput = document.getElementById('screenshot');
            const file = fileInput.files[0];

            const captionText = `📌 *New Request (Crore Bet)*\n\n` +
                                `📧 *Email:* ${email}\n` +
                                `👤 *Name:* ${name}\n` +
                                `📞 *Phone:* ${phone}\n` +
                                `🆔 *User ID:* ${userId}\n` +
                                `⚠️ *Problem Issue:* ${problemIssue}`;

            if (file) {
                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append("photo", file);
                formData.append("caption", captionText);
                formData.append("parse_mode", "Markdown");

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: "POST",
                    body: formData
                })
                .then(res => res.json())
                .then(handleResponse)
                .catch(handleError);

            } else {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: captionText,
                        parse_mode: "Markdown"
                    })
                })
                .then(res => res.json())
                .then(handleResponse)
                .catch(handleError);
            }

            function handleResponse(data) {
                if (data.ok) {
                    statusMsg.style.color = "#38ef7d";
                    statusMsg.innerText = "Request submitted successfully!";
                    form.reset();
                } else {
                    statusMsg.style.color = "#ff4d4d";
                    statusMsg.innerText = "Failed to send request. Check Bot Token or Chat ID.";
                }
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Request";
            }

            function handleError() {
                statusMsg.style.color = "#ff4d4d";
                statusMsg.innerText = "Network error! Please try again.";
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Request";
            }
        });
    </script>

</body>
</html>
