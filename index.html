<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Request (Crore Bet)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .form-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* --- CRORE BET LOGO STYLING --- */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .crore-bet-logo {
            background-color: #000000;
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .crore-text {
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-right: 10px;
            text-transform: uppercase;
        }
        .bet-badge {
            background-color: #fff230;
            color: #000000;
            font-size: 19px;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #222;
            font-size: 19px;
            font-weight: 700;
        }
        .input-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #555;
            font-weight: 600;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="file"],
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s;
        }
        input[type="file"] {
            padding: 8px;
            background-color: #f9f9f9;
            cursor: pointer;
        }
        input:focus,
        select:focus {
            border-color: #0088cc;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0088cc;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0077b5;
        }
        button:disabled {
            background-color: #a0cbe2;
            cursor: not-allowed;
        }
        #statusMsg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <!-- फोटो वाला CRORE BET लोगो -->
        <div class="logo-wrapper">
            <div class="crore-bet-logo">
                <span class="crore-text">CRORE</span>
                <span class="bet-badge">BET</span>
            </div>
        </div>

        <h2>New Request (Crore Bet)</h2>
        <form id="tgForm">
            <!-- 1. Email -->
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <!-- 2. Name -->
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <!-- 3. Phone Number -->
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>
            </div>

            <!-- 4. User ID -->
            <div class="input-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" placeholder="Enter your user ID" required>
            </div>

            <!-- 5. Problem Issue -->
            <div class="input-group">
                <label for="problemIssue">Problem Issue</label>
                <select id="problemIssue" required>
                    <option value="" disabled selected>Select an issue...</option>
                    <option value="Email Confirm">Email Confirm</option>
                    <option value="Number Confirm">Number Confirm</option>
                    <option value="Profile Update">Profile Update</option>
                    <option value="Deposit Problem">Deposit Problem</option>
                    <option value="Bonus Issue">Bonus Issue</option>
                </select>
            </div>

            <!-- 6. Screenshot -->
            <div class="input-group">
                <label for="screenshot">Upload Screenshot (Optional)</label>
                <input type="file" id="screenshot" accept="image/*">
            </div>

            <button type="submit" id="submitBtn">Submit Request</button>
            <p id="statusMsg"></p>
        </form>
    </div>

    <script>
        // अपना Telegram Bot Token और Chat ID यहाँ डालें
        const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";
        const CHAT_ID = "YOUR_CHAT_ID_HERE";

        const form = document.getElementById('tgForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";
            statusMsg.innerText = "";

            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const userId = document.getElementById('userId').value;
            const problemIssue = document.getElementById('problemIssue').value;
            const fileInput = document.getElementById('screenshot');
            const file = fileInput.files[0];

            const captionText = `📌 *New Request (Crore Bet)*\n\n` +
                                `📧 *Email:* ${email}\n` +
                                `👤 *Name:* ${name}\n` +
                                `📞 *Phone:* ${phone}\n` +
                                `🆔 *User ID:* ${userId}\n` +
                                `⚠️ *Problem Issue:* ${problemIssue}`;

            if (file) {
                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append("photo", file);
                formData.append("caption", captionText);
                formData.append("parse_mode", "Markdown");

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: "POST",
                    body: formData
                })
                .then(res => res.json())
                .then(handleResponse)
                .catch(handleError);

            } else {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: captionText,
                        parse_mode: "Markdown"
                    })
                })
                .then(res => res.json())
                .then(handleResponse)
                .catch(handleError);
            }

            function handleResponse(data) {
                if (data.ok) {
                    statusMsg.style.color = "green";
                    statusMsg.innerText = "Request submitted successfully!";
                    form.reset();
                } else {
                    statusMsg.style.color = "red";
                    statusMsg.innerText = "Failed to send request. Check Bot Token or Chat ID.";
                }
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Request";
            }

            function handleError() {
                statusMsg.style.color = "red";
                statusMsg.innerText = "Network error! Please try again.";
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Request";
            }
        });
    </script>

</body>
</html>
